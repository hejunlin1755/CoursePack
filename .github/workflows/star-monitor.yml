name: Monitor CoursePack stars

on:
  schedule:
    # Run once per hour, offset from the top of the hour.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Read public star count
        id: repo
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/hejunlin1755/CoursePack)"
          stars="$(jq -r '.stargazers_count' <<<"$response")"
          forks="$(jq -r '.forks_count' <<<"$response")"
          if [[ ! "$stars" =~ ^[0-9]+$ ]]; then
            echo "GitHub API returned an invalid star count" >&2
            exit 1
          fi
          printf 'stars=%s\n' "$stars" >> "$GITHUB_OUTPUT"
          printf 'forks=%s\n' "$forks" >> "$GITHUB_OUTPUT"
          printf '{"checked_at":"%s","stars":%s,"forks":%s}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$stars" "$forks" > star-count.json

      - name: Write run summary
        shell: bash
        run: |
          stars='${{ steps.repo.outputs.stars }}'
          forks='${{ steps.repo.outputs.forks }}'
          if (( stars >= 100 )); then
            {
              echo '## CoursePack 已达到 100+ Stars'
              echo
              echo "当前 Stars：**$stars**"
              echo "Forks：**$forks**"
              echo
              echo '达到目标后不再自动生成宣传动作。'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            remaining=$((100 - stars))
            {
              echo '## CoursePack Star 监测'
              echo
              echo "当前 Stars：**$stars**（距离 100 还差 **$remaining**）"
              echo "Forks：**$forks**"
              echo
              echo '本次仅记录数据；宣传必须由真实受众、不同渠道和不同内容产生，不自动发帖。'
            } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the latest public snapshot
        uses: actions/upload-artifact@v4
        with:
          name: coursepack-star-count-${{ github.run_number }}
          path: star-count.json
          retention-days: 30
